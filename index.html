<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Our Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script&family=Parisienne&family=Pacifico&family=Caveat&family=Indie+Flower&family=Satisfy&family=Playfair+Display&family=Cormorant+Garamond:wght@500&family=Shadows+Into+Light&family=Amatic+SC&family=Lobster&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b1f2b;--wine:#7a2e47;--blush:#f6dfe2;--paper:#fff8f0;--gold:#c9a15d;--line:#e8cfd1}
*{box-sizing:border-box}html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;background:#ffd6e3;color:var(--ink)}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--wine);color:#fff}
button.ghost{background:#fff;color:var(--wine);border:1px solid var(--line)}
h1,h2,h3{font-family:'Playfair Display',serif;margin:0}
/* home */
#home{padding:28px;max-width:900px;margin:auto}
.cards{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}
.card{width:190px;height:150px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.card.new{background:var(--wine);color:#fff;align-items:center;justify-content:center;font-size:20px;cursor:pointer;font-family:'Playfair Display',serif}
.card div{display:flex;gap:6px;flex-wrap:wrap}.card button{padding:6px 10px;font-size:13px}
.card.new.alt{background:#fff;color:var(--wine);border:2px dashed var(--wine);font-size:17px;text-align:center}
.sg{background:#fff;color:var(--wine);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
/* editor */
#ed{display:grid;grid-template-rows:auto 1fr auto;height:100%}
.top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.top input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.main{display:grid;grid-template-columns:230px 1fr 250px;min-height:0}
.side{background:#fff;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.side label{display:flex;flex-direction:column;font-size:13px;gap:3px}
.side textarea,.side select{border:1px solid var(--line);border-radius:8px;padding:6px}
.side input[type=color]{width:100%;height:34px;border:0;padding:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.grid button{background:var(--paper);padding:4px;font-size:20px;color:inherit}
.words{display:flex;flex-wrap:wrap;gap:5px}.words button{background:var(--paper);color:var(--wine);font-size:13px;padding:5px 8px}
.arr{display:flex;gap:6px}.arr button{flex:1}
.hint{font-size:13px;opacity:.7}
.stage{display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;background:#ecc9cf}
#cv{height:100%;max-height:100%;aspect-ratio:5/7;box-shadow:0 12px 40px #7a2e4755;border-radius:4px;overflow:hidden}
.strip{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-top:1px solid var(--line);overflow-x:auto}
.strip button{flex:none;background:var(--paper);color:var(--ink);border:1px solid var(--line);min-width:42px}
.strip button.on{background:var(--wine);color:#fff}
.strip .plus{background:var(--wine);color:#fff;font-size:18px}.strip b{white-space:nowrap}
/* pages */
.page{width:100%;height:100%;position:relative;container-type:size;overflow:hidden}
.el{position:absolute;user-select:none;touch-action:none;white-space:pre;line-height:1.15}
.el img{display:block;width:100%;pointer-events:none}
.el.sel{outline:2px dashed var(--wine);outline-offset:4px}
/* notebook theme */
.nbl,.nbc{position:absolute;inset:0;pointer-events:none}
.nbl{background:linear-gradient(#0000 calc(100% - 1.5px),#f2a2bb 0) 0 11cqw/100% 7cqw repeat-y}
.nbl::before{content:'';position:absolute;left:12cqw;top:0;bottom:0;width:1.5px;background:#ee6f9a;opacity:.55}
.nbl::after{content:'';position:absolute;left:0;right:0;top:0;height:4cqw;background:linear-gradient(#f7a8c4,#0000);opacity:.5}
.nbc::before{content:'';position:absolute;inset:5cqw;border:2px dashed #ffffffd0;border-radius:3cqw}
.nbc::after{content:'';position:absolute;left:16cqw;right:16cqw;top:42cqw;height:52cqw;background:#fff8;border-radius:3cqw;box-shadow:0 1cqw 3cqw #c2185b33}
/* viewer */
button{transition:.15s}button:hover{filter:brightness(1.1)}
#v{position:fixed;left:0;top:0;background:radial-gradient(#ffffff17 1.3px,transparent 1.8px) 0 0/24px 24px,radial-gradient(ellipse at 50% 40%,#3d1624,#1d0a11 85%);z-index:9;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;container-type:size}
#v[hidden]{display:none}
.wrap{--u:calc(min(98cqw,calc(90cqh*10/7))/100);perspective:2600px;width:min(98cqw,calc(90cqh*10/7));aspect-ratio:10/7;margin-top:-3cqh}
.book{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.half{position:absolute;top:0;width:50%;height:100%;background:#fff7f2}
.half.l{left:0;border-radius:calc(var(--u)*1.5) 0 0 calc(var(--u)*1.5);box-shadow:calc(var(--u)*-.45) calc(var(--u)*.45) 0 #fff4ee,calc(var(--u)*-.9) calc(var(--u)*.9) 0 #f1c3cf,calc(var(--u)*-1.35) calc(var(--u)*1.35) 0 #fff4ee,calc(var(--u)*-1.8) calc(var(--u)*1.8) 0 #f1c3cf,0 calc(var(--u)*3.4) calc(var(--u)*4) #000a}
.half.r{left:50%;border-radius:0 calc(var(--u)*1.5) calc(var(--u)*1.5) 0;box-shadow:calc(var(--u)*.45) calc(var(--u)*.45) 0 #fff4ee,calc(var(--u)*.9) calc(var(--u)*.9) 0 #f1c3cf,calc(var(--u)*1.35) calc(var(--u)*1.35) 0 #fff4ee,calc(var(--u)*1.8) calc(var(--u)*1.8) 0 #f1c3cf,0 calc(var(--u)*3.4) calc(var(--u)*4) #000a}
.half::after{content:'';position:absolute;inset:0;pointer-events:none}
.half.l::after{background:linear-gradient(90deg,transparent 78%,#3b1f2b38)}
.half.r::after{background:linear-gradient(270deg,transparent 78%,#3b1f2b38)}
.sh{position:absolute;top:0;width:50%;height:100%;pointer-events:none;opacity:0}
.sh.l{left:0;background:linear-gradient(90deg,transparent 30%,#000)}
.sh.r{left:50%;background:linear-gradient(270deg,transparent 30%,#000)}
.lf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-style:preserve-3d;transform-origin:left}
.st{position:absolute;top:0;left:0;height:100%;transform-origin:left;transform-style:preserve-3d}
.st .st{left:100%;width:100%}
.fa{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#ffe4ec}
.fa.b{transform:rotateY(180deg)}
.fa .cl{position:absolute;top:0;height:100%}
.fa .ov{position:absolute;inset:0;background:#2a1018;opacity:0;pointer-events:none}
.pill{opacity:0;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff9;backdrop-filter:blur(6px);color:var(--wine);padding:6px 14px;border-radius:99px;font-size:13px;transition:opacity .6s;pointer-events:none}
.x{position:absolute;top:10px;right:10px;background:#fff;color:var(--wine);z-index:3}
.start{position:absolute;inset:0;z-index:4;cursor:pointer;transition:opacity .7s}
.tto{position:absolute;left:0;right:0;bottom:calc(50cqh - min(98cqw*.7,90cqh)/2 + 4.5cqh);text-align:center;color:#fff;font:600 clamp(11px,3.4cqh,18px) 'DM Sans',sans-serif;letter-spacing:.2em;text-shadow:0 1px 8px #000b;animation:tp 1.6s ease-in-out infinite alternate}
@keyframes tp{from{opacity:.5}to{opacity:1}}
.pgb{position:absolute;inset:0;border:1.3cqw solid #e0457b;pointer-events:none;z-index:50;box-sizing:border-box}
.page.l,.page.l .pgb{border-radius:3cqw 0 0 3cqw}.page.r,.page.r .pgb{border-radius:0 3cqw 3cqw 0}.page.e,.page.e .pgb{border-radius:2cqw}
.rib{position:absolute;bottom:calc(var(--u)*-4);width:calc(var(--u)*2.8);height:calc(var(--u)*5.2);transform:translateX(-50%);background:linear-gradient(90deg,#b3134f,#ff5c8a 50%,#b3134f);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);z-index:5;pointer-events:none}
/* voice note + video */
.vn{display:flex;align-items:center;gap:3.5cqw;padding:3cqw 5cqw 3cqw 3cqw;background:linear-gradient(#fff,#fff5f8);border-radius:99px;box-shadow:0 3cqw 8cqw #e7557f40;font-family:'DM Sans',sans-serif}
.pb{flex:none;width:14cqw;height:14cqw;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#f9a8c4,#c2185b);box-shadow:0 2.5cqw 5cqw #c2185b66,inset 0 .5cqw 1cqw #fff6}
.pb svg{width:50%;height:50%}.pb .pa{display:none}.vn.on .pb .pa{display:block}.vn.on .pb .pl{display:none}
.wv{flex:1;display:flex;align-items:center;gap:1.1cqw;height:10cqw}
.wv i{width:1.1cqw;border-radius:9px;background:#eab0c2;transition:background .2s}.wv i.d{background:#e0527f}
.vn span{font-size:3.5cqw;color:#b5748a;white-space:nowrap}
.vn.on .wv i{animation:wv .8s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-70ms)}
@keyframes wv{from{transform:scaleY(.35)}to{transform:scaleY(1.2)}}
/* loading screen */
.ld{position:absolute;inset:0;z-index:8;background:radial-gradient(ellipse at 50% 40%,#4a2b1c,#24130c 78%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;text-align:center;transition:opacity .8s;font-family:'DM Sans',sans-serif}
.ld .ph{width:10cqh;height:5.6cqh;border:.5cqh solid #fff;border-radius:1.2cqh;animation:rt 2.6s ease-in-out infinite}
@keyframes rt{0%,15%{transform:rotate(-90deg)}55%,100%{transform:rotate(0)}}
.ld h3{font:500 clamp(22px,8cqh,48px) 'Playfair Display',serif;margin:0;color:#fff}
.lb{width:min(56cqw,560px);height:1.8cqh;min-height:8px;background:#ffffff26;border-radius:99px;overflow:hidden}
.lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6dfe2,#fff);border-radius:99px;box-shadow:0 0 14px #ffffff90}
.ld b{font-size:clamp(14px,4.2cqh,24px);color:#fff;letter-spacing:.1em;font-weight:600}
@media (max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;overflow:auto}}
</style></head><body>
<div id="home"></div>
<div id="ed" hidden>
 <div class="top"><button class="ghost" onclick="home()">← Back</button><input id="nm" oninput="cur.name=this.value;save()"><button class="ghost" onclick="viewer(pub(),1)">Preview</button><button onclick="publish()">Publish</button></div>
 <div class="main">
  <div class="side" id="tools"></div>
  <div class="stage"><div id="cv" onpointerdown="sel=null;props();draw()"></div></div>
  <div class="side" id="props"></div>
 </div>
 <div class="strip" id="strip"></div>
</div>
<input type=file id=imp accept=".zip,.json,application/zip,application/json" hidden onchange="imp(this)">
<div id="v" hidden></div>
<script>
const $=s=>document.querySelector(s);
const FONTS=['Great Vibes','Dancing Script','Parisienne','Pacifico','Caveat','Indie Flower','Satisfy','Playfair Display','Cormorant Garamond','Shadows Into Light','Amatic SC','Lobster'];
const EMO=['🌸','💌','✨','🦋','🍓','🧸','🎀','🤍','🌙','⭐','🕊️','🌷','💫','🫶','☁️','🍒','🥂','🌹','🐻','💍','📸','🎞️','🫧','💕','🌼'];
const WORDS=['us ♡','forever','my favourite','26.11','i love you','always'];
let books=JSON.parse(localStorage.getItem('lb')||'[]'),cur,pi=0,sel=null,busy=0;
const save=()=>{try{localStorage.setItem('lb',JSON.stringify(books))}catch(e){alert('Storage full — photos kam ya chhoti karo.')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const T=(v,f,s,c,x=50,y=50)=>({id:uid(),t:'text',v,f,s,c,x,y,r:0,op:1,br:1,crop:[0,0,0,0]});
const cover=(a,b,e)=>({bg:'#f48fb1',nb:'cover',...(e?{end:1}:{}),els:[{...T(a,'Great Vibes',17,'#c2185b',50,38),dflt:1},{...T(b,'Cormorant Garamond',6,'#ad4a6b',50,58),dflt:1}]});
const ensureEnd=b=>{if(!b.pages.some(p=>p.end))b.pages.push(cover('The End','forever yours ♡',1))};
function newBook(){const b={id:uid(),name:'Our book',pages:[cover('For you','26 November ♡'),{bg:'#ffe4ec',nb:1,els:[T('Dear you,\nwrite here…','Caveat',7,'#7a2e47',50,30)]},cover('The End','forever yours ♡',1)]};books.push(b);save();open(b.id)}
/* extract / import a downloaded my-book.zip (or book.json) */
const MIME={jpg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime'};
async function unzip(file){const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
 let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw 0;
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
 for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=dec.decode(u8.subarray(p+46,p+46+nl));
  p+=46+nl+xl+cl;if(name.endsWith('/'))continue;
  const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);let d=u8.subarray(st,st+cs);
  if(m==8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  out.push({n:name,d})}
 return out}
async function imp(i){const f=i.files[0];i.value='';if(!f)return;
 try{let b;
  if(/\.json$/i.test(f.name))b=JSON.parse(await f.text());
  else{const z=(await unzip(f)).filter(x=>!/__MACOSX|\/\._|^\._/.test(x.n));
   const j=z.filter(x=>/(^|\/)book\.json$/.test(x.n)).sort((a,c)=>a.n.length-c.n.length)[0];
   b=JSON.parse(new TextDecoder().decode(j.d));const ids=Object.create(null);
   for(const x of z){const m=x.n.match(/media\/([^\/]+)\.([a-z0-9]+)$/i);if(m){await mput(m[1],new Blob([x.d],{type:MIME[m[2].toLowerCase()]||''}));ids['media/'+m[1]+'.'+m[2]]='idb:'+m[1]}}
   b.pages.forEach(p=>{if(ids[p.pic])p.pic=ids[p.pic];p.els.forEach(e=>{if(typeof e.v=='string'&&ids[e.v])e.v=ids[e.v]})})}
  if(!b.pages)throw 0;b.id=uid();ensureEnd(b);books.push(b);save();open(b.id)}
 catch(err){alert('Ye file padh nahi paya. Wahi my-book.zip (ya book.json) chuno jo Publish se download hui thi.')}}
/* home */
function home(){$('#ed').hidden=true;$('#home').hidden=false;
 $('#home').innerHTML=`<h1 style="font:400 46px 'Great Vibes',cursive;color:#7a2e47">Our Book</h1><p class=hint>Admin studio — apni kahani yahan likho ♡</p><div class=cards><div class="card new" onclick="newBook()">+ Create one</div><div class="card new alt" onclick="$('#imp').click()">⤓ Extract from file</div>${books.map(b=>`<div class=card><b>${b.name}</b><div><button onclick="open('${b.id}')">Edit</button><button class=ghost onclick="viewer(JSON.parse(JSON.stringify(books.find(x=>x.id=='${b.id}'))),1)">Open</button><button class=ghost onclick="del('${b.id}')">Delete</button></div></div>`).join('')}</div>`}
function del(id){if(confirm('Delete this book?')){books=books.filter(b=>b.id!=id);save();home()}}
function open(id){cur=books.find(b=>b.id==id);ensureEnd(cur);pi=0;sel=null;$('#home').hidden=true;$('#ed').hidden=false;$('#nm').value=cur.name;tools();draw();props();strip()}
/* rendering */
const BARS=[9,14,22,10,18,28,12,20,34,16,24,12,30,18,10,26,14,20,8,16,24,12,18,10];
let CA=null,SONG=null,SW=0,SI=0;
function stopA(r){CA&&CA.pause();document.querySelectorAll('.vn.on').forEach(n=>n.classList.remove('on'));document.querySelectorAll('video').forEach(v=>v.pause());if(r)songResume()}
const SN=['backgoundsong.mp3','backgroundsong.mp3'];
function songInit(){if(SONG||SI>=SN.length)return;const a=new Audio(SN[SI]);a.loop=true;a.volume=.55;a.preload='auto';a.onerror=()=>{if(SONG!==a)return;SONG=null;if(++SI<SN.length){songInit();if(SW&&SONG)SONG.play().catch(()=>{})}};SONG=a}
const songPlay=()=>{SW=1;SONG&&SONG.play().catch(()=>{})},songStop=()=>{SW=0;SONG&&SONG.pause()},songPause=()=>SONG&&SONG.pause(),songResume=()=>{SW&&SONG&&SONG.play().catch(()=>{})};
function elNode(e,edit,g){const n=document.createElement('div');n.className='el'+(edit&&e.id===sel?' sel':'');
 n.style.cssText=`left:${e.x}%;top:${e.y}%;transform:translate(-50%,-50%) rotate(${e.r}deg);opacity:${e.op};filter:brightness(${e.br});mix-blend-mode:${e.bm||'normal'}`;
 if(e.t=='img'){n.style.width=e.s+'%';const i=new Image(),fail=()=>{if(edit){i.removeAttribute('src');i.style.cssText='display:block;width:100%;aspect-ratio:3/4;background:#fff9;border:2px dashed #c2185b;box-sizing:border-box';i.title='File missing - delete and upload again'}else i.style.display='none'};
  i.onerror=()=>{const m=String(e.v).match(/^media\/([^\/]+)\.[a-z0-9]+$/i);if(m&&!i._r){i._r=1;mget(m[1]).then(b=>{if(b)i.src=URL.createObjectURL(b);else fail()})}else fail()};
  murl(e.v,u=>{i.src=u});const c=e.crop;i.style.clipPath=`inset(${c[0]}% ${c[1]}% ${c[2]}% ${c[3]}%)`;n.append(i)}
 else if(e.t=='vn'){n.style.width=e.s+'%';n.style.containerType='inline-size';
  n.innerHTML=`<div class=vn><button class=pb tabindex=-1><svg class=pl viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg><svg class=pa viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="#fff"/></svg></button><div class=wv>${BARS.map((h,i)=>`<i style="height:${h*.25}cqw;--i:${i}"></i>`).join('')}</div><span>${esc(e.lb||'voice note')}</span></div>`;
  if(!edit&&!g){const v=n.firstChild,bars=[...v.querySelectorAll('i')];
   v.querySelector('.pb').onclick=ev=>{ev.stopPropagation();if(v._a&&!v._a.paused){v._a.pause();v.classList.remove('on');songResume();return}
    stopA();const nm='vn'+(e.slot||1)+'.mp3',a=v._a=v._a||new Audio(nm);CA=a;a.preload='auto';
    a.ontimeupdate=()=>{const f=a.currentTime/(a.duration||1);bars.forEach((b,i)=>b.classList.toggle('d',i/bars.length<f))};
    a.onended=()=>{v.classList.remove('on');bars.forEach(b=>b.classList.remove('d'));songResume()};
    a.onerror=()=>{v.classList.remove('on');songResume();const sp=v.querySelector('span');sp.textContent=nm+' not found';setTimeout(()=>{sp.textContent=e.lb||'voice note'},2500)};
    songPause();v.classList.add('on');const pr=a.play();pr&&pr.catch&&pr.catch(()=>{})}}}
 else if(e.t=='video'){n.style.width=e.s+'%';
  if(g)n.innerHTML='<div style="aspect-ratio:16/9;background:#2a1018;border-radius:2cqw"></div>';
  else{const v=document.createElement('video');v.playsInline=true;v.preload='metadata';v.controls=!edit;if(!edit){v.onplay=()=>songPause();v.onpause=v.onended=()=>songResume()}v.style.cssText='width:100%;display:block;border-radius:2cqw;background:#000;'+(edit?'pointer-events:none':'');n.append(v);murl(e.v,u=>{v.src=u})}}
 else{n.style.fontSize=e.s+'cqw';n.style.fontFamily=`'${e.f}',serif`;n.style.color=e.c;n.textContent=e.v}
 if(edit)n.onpointerdown=ev=>drag(ev,e);return n}
function pageEl(p,edit,g,side){const d=document.createElement('div');d.className='page'+(side?' '+side:'');d.style.background=p?p.bg:'transparent';if(p&&p.nb){const l=document.createElement('div');l.className=p.nb==='cover'?'nbc':'nbl';d.append(l)}if(p&&p.pic){const im=document.createElement('img');murl(p.pic,u=>{im.src=u});im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none';d.append(im)}if(p)p.els.forEach(e=>d.append(elNode(e,edit,g)));if(p&&side){const b=document.createElement('div');b.className='pgb';d.append(b)}return d}
