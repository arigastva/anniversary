<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
<title>Meri Jaan ka Book</title>
<style>
  :root { --W: 300px; --H: 420px; --ink: #ffe3ec; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background-color: #2a0d1e;
    background-image: radial-gradient(rgba(255,150,185,.11) 1.6px, transparent 1.8px), radial-gradient(ellipse at 50% 38%, #4e1a37 0%, #2a0d1e 68%, #190711 100%);
    background-size: 26px 26px, 100% 100%;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
  }

  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
  .stage.dragging { cursor: grabbing; }
  .col { display: flex; flex-direction: column; align-items: center; }

  /* wrap = poora khula book (2 pages), perspective yahin hai. JS isse left-right sarkata hai */
  .wrap { position: relative; width: calc(var(--W) * 2); height: var(--H); perspective: 2400px; flex: none; }
  .shadow { position: absolute; bottom: -20px; height: 22px; left: 0; width: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 70%); filter: blur(5px); pointer-events: none; }
  .board { position: absolute; top: -6px; bottom: -6px; left: 0; width: 0; border-radius: 13px; background: linear-gradient(145deg, #ec4a8a, #d92f78); box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,190,215,.45); }
  .stack { position: absolute; top: 4px; bottom: -14px; left: 0; width: 0; border-radius: 6px 15px 15px 6px; background: #fff3ef; box-shadow: 3px 3px 0 #f5d2dc, 5px 5px 0 #fff4f2, 7px 7px 0 #eec3d0; }
  .ribbon { position: absolute; left: 0; bottom: -40px; width: 17px; height: 46px; background: linear-gradient(90deg, #b30f2c, #e92a4b 50%, #a80d27); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
  .book { position: absolute; inset: 0; transform-style: preserve-3d; }
  .hint { position: absolute; left: 50%; right: 0; bottom: 5%; z-index: 30; text-align: center; pointer-events: none; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.7); font: 600 clamp(11px, 3vw, 15px)/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .24em; transition: opacity .35s; }
  .hint.off { opacity: 0; }

  .sheet { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; overflow: hidden; background: #ffe6ee; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.front { border-radius: 0 7px 7px 0; }
  .face.back { transform: rotateY(180deg); border-radius: 7px 0 0 7px; }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
  .face .missing { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12%; color: #b04068; font-size: 14px; background: #fff0f4; }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .face.front::after { background: linear-gradient(to right, rgba(0,0,0,.28), rgba(0,0,0,.08) 4%, rgba(0,0,0,0) 12%); }
  .face.back::after  { background: linear-gradient(to left,  rgba(0,0,0,.28), rgba(0,0,0,.08) 4%, rgba(0,0,0,0) 12%); }
  .shade { position: absolute; inset: 0; background: #1a0610; opacity: 0; pointer-events: none; z-index: 2; }
  .under { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; }
  .face.front .under { background: linear-gradient(to right, rgba(20,4,10,.95), rgba(20,4,10,0) 75%); }
  .face.back .under { background: linear-gradient(to left, rgba(20,4,10,.95), rgba(20,4,10,0) 75%); }

  /* curling page (strips) – sirf page palatte waqt */
  .curl { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; display: none; transform-style: preserve-3d; pointer-events: none; }
  .strip { position: absolute; top: 0; height: 100%; transform-origin: left center; transform-style: preserve-3d; }
  .strip.s0 { left: 0; }
  .strip.sc { left: 100%; width: 100%; }
  .sf, .sb { position: absolute; top: 0; bottom: 0; left: 0; right: -0.6px; background-color: #ffe6ee; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .sb { transform: rotateY(180deg); }
  .sf.last { border-radius: 0 7px 7px 0; }
  .sb.last { border-radius: 7px 0 0 7px; }
  .sf::after, .sb::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .s0 > .sf::after { background: linear-gradient(to right, rgba(0,0,0,.28), rgba(0,0,0,.08)); }
  .s0 > .sb::after { background: linear-gradient(to left, rgba(0,0,0,.28), rgba(0,0,0,.08)); }
  .s1 > .sf::after { background: linear-gradient(to right, rgba(0,0,0,.08), rgba(0,0,0,0)); }
  .s1 > .sb::after { background: linear-gradient(to left, rgba(0,0,0,.08), rgba(0,0,0,0)); }
  .sh { position: absolute; inset: 0; background: #1a0610; opacity: 0; display: block; z-index: 2; }

  /* voice note hotspots */
  .hot { position: absolute; z-index: 5; border-radius: 999px; cursor: pointer; }
  .hot::after { content: ""; position: absolute; inset: -8px; }
  .hot .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: rgba(214, 40, 110, .28); pointer-events: none; }
  .hot::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 0 rgba(233, 64, 130, .75); animation: ping 1.8s ease-out infinite; pointer-events: none; }
  .hot.playing::before { animation: none; box-shadow: 0 0 0 2px rgba(233, 64, 130, .9), 0 0 14px 2px rgba(233, 64, 130, .6); }
  .hot .ico { position: absolute; left: 1.2%; top: 5%; height: 90%; aspect-ratio: 1; border-radius: 50%; display: none; align-items: center; justify-content: center; gap: 13%; background: linear-gradient(135deg, #f071a8, #c8397b); box-shadow: 0 2px 6px rgba(160,30,90,.35); pointer-events: none; }
  .hot.playing .ico { display: flex; }
  .hot .ico i { display: block; width: 13%; height: 42%; background: #fff; border-radius: 2px; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(233,64,130,.7); } 80%, 100% { box-shadow: 0 0 0 12px rgba(233,64,130,0); } }

  /* caption + arrows */
  .nav { width: min(calc(100vw - 24px), 460px); margin-top: 38px; padding: 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cap { flex: 1; text-align: center; font-size: clamp(18px, 4.6vw, 24px); letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
  .btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(255,227,236,.14); color: var(--ink); font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: background .2s, opacity .2s; }
  .btn:hover { background: rgba(255,227,236,.28); }
  .btn:focus-visible { outline: 2px solid #ff9ec0; outline-offset: 2px; }
  .btn[disabled] { opacity: .25; cursor: default; }

  /* loading screen */
  .loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity .9s ease;
    background: radial-gradient(ellipse at 50% 40%, #4a2a1c 0%, #35190f 55%, #22120c 100%); }
  .loader.hide { opacity: 0; pointer-events: none; }
  .phone { position: relative; width: 52px; height: 92px; border: 4px solid #fff; border-radius: 14px; margin-bottom: 26px; animation: bob 2.2s ease-in-out infinite; }
  .phone::after { content: ""; position: absolute; top: 7px; left: 50%; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; background: rgba(255,255,255,.7); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .ttl { margin: 0; font: 400 clamp(28px, 6vw, 46px)/1.15 "Playfair Display", Georgia, "Times New Roman", serif; color: #fff; padding: 0 20px; }
  .bar { width: min(560px, 72vw); height: 17px; margin-top: 34px; border-radius: 9px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 9px; background: linear-gradient(90deg, #ffe9ef, #fff); }
  .pct { margin-top: 26px; font: 700 20px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .06em; color: #fff; }
  @media (prefers-reduced-motion: reduce) { .phone, .hot::before { animation: none; } }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="col">
    <div class="wrap" id="wrap">
      <div class="shadow" id="shadow"></div>
      <div class="ribbon" id="ribbon"></div>
      <div class="stack" id="stack"></div>
      <div class="board" id="board"></div>
      <div class="book" id="book"></div>
      <div class="hint" id="hint">TAP TO OPEN &#9829;</div>
    </div>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Pichla page" disabled>&#8249;</button>
      <div class="cap" id="cap">Cover Page</div>
      <button class="btn" id="next" aria-label="Agla page">&#8250;</button>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div class="phone"></div>
  <h1 class="ttl">Opening your book</h1>
  <div class="bar"><i id="barfill"></i></div>
  <div class="pct" id="pct">0%</div>
</div>

<script>
/* =====================================================================
   SETTINGS – sirf yahan badalna hai
   ===================================================================== */
const CONFIG = {
  // Sab files GitHub repo ke root mein hain (koi folder nahi)
  cover: "coverpage.png",
  end:   "theend.png",

  pageCount: 17,                 // page1.png ... page17.png (page18 dalna ho toh 18 likho)
  pagePattern: "page{n}.png",

  ratio: 0.714,                  // ek page ki width / height (image se apne aap set ho jaata hai)

  // Background music: in naamon mein se jo file repo mein mile wo chalegi
  bgm: ["bgm.mp3", "music.mp3", "bgmusic.mp3", "background.mp3", "song.mp3"],
  bgmVolume: 0.45,

  // Voice notes (x,y,w,h = pill ki jagah, page ke % mein)
  voiceNotes: [
    { page: 8,  x: 32.2, y: 72.8, w: 36.4, h: 5.2, src: "voicenote.mp3" },  // "play the vn !" wala page
    { page: 15, x: 50.5, y: 42.8, w: 46,   h: 7.0, src: "hercore.mp3" }     // "iluuuuu smm" wala page
  ]
};

/* =====================================================================
   BOOK ENGINE
   - Cover aur End akele (single), beech mein 2 pages ka spread
   - Chhoti screen pe: ek page poora, uske baju wala thoda sa jhalakta hai;
     us pe tap karo toh woh poora aa jaata hai
   ===================================================================== */
(function () {
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), wrap = $("wrap"), book = $("book");
  const shadow = $("shadow"), board = $("board"), stack = $("stack"), ribbon = $("ribbon");
  const btnPrev = $("prev"), btnNext = $("next"), cap = $("cap"), hint = $("hint");

  // leaf 0 = cover, leaf n = page n, (blank agar zaroorat), last leaf = end
  const leaves = [CONFIG.cover];
  for (let n = 1; n <= CONFIG.pageCount; n++) leaves.push(CONFIG.pagePattern.replace("{n}", n));
  if (leaves.length % 2 === 0) leaves.push(null);       // pages odd hon toh ek blank page
  leaves.push(CONFIG.end);
  const M = leaves.length;          // even
  const N = M / 2;                  // sheets

  let W = 300, H = 420, vw = 800, vh = 600;
  let peek = false;                 // chhoti screen mode
  const MRG = 16;
  let PEEK = 44;

  const S = [];
  const K = 14, BEND = 3.4;

  function makeFace(src, cls) {
    const f = document.createElement("div");
    f.className = "face " + cls;
    if (src) {
      const img = new Image();
      img.alt = ""; img.draggable = false; img.decoding = "async";
      img.src = src;
      img.onerror = () => { img.remove(); const m = document.createElement("div"); m.className = "missing"; m.textContent = src + " nahi mili"; f.insertBefore(m, f.firstChild); };
      f.appendChild(img);
    }
    const sh = document.createElement("div"); sh.className = "shade"; f.appendChild(sh); f._shade = sh;
    const u = document.createElement("div"); u.className = "under"; f.appendChild(u); f._under = u;
    return f;
  }

  function buildCurl(srcF, srcB) {
    const root = document.createElement("div"); root.className = "curl";
    const strips = [];
    let parent = root;
    for (let j = 0; j < K; j++) {
      const st = document.createElement("div");
      st.className = "strip " + (j === 0 ? "s0" : "sc") + " s" + j;
      if (j === 0) st.style.width = (100 / K) + "%";
      const sf = document.createElement("div"); sf.className = "sf" + (j === K - 1 ? " last" : "");
      const sb = document.createElement("div"); sb.className = "sb" + (j === K - 1 ? " last" : "");
      if (srcF) {
        sf.style.backgroundImage = "url(\"" + srcF + "\")";
        sf.style.backgroundSize = (K * 100) + "% 100%";
        sf.style.backgroundPosition = (j / (K - 1) * 100) + "% 0";
      }
      if (srcB) {
        sb.style.backgroundImage = "url(\"" + srcB + "\")";
        sb.style.backgroundSize = (K * 100) + "% 100%";
        sb.style.backgroundPosition = ((K - 1 - j) / (K - 1) * 100) + "% 0";
      }
      const shf = document.createElement("i"); shf.className = "sh"; sf.appendChild(shf);
      const shb = document.createElement("i"); shb.className = "sh"; sb.appendChild(shb);
      st.appendChild(sf); st.appendChild(sb);
      parent.appendChild(st);
      strips.push({ el: st, shf, shb });
      parent = st;
    }
    return { root, strips };
  }

  for (let i = 0; i < N; i++) {
    const el = document.createElement("div"); el.className = "sheet";
    const front = makeFace(leaves[2 * i], "front");
    const back = makeFace(leaves[2 * i + 1], "back");
    el.appendChild(front); el.appendChild(back);
    book.appendChild(el);
    const curl = buildCurl(leaves[2 * i], leaves[2 * i + 1]);
    book.appendChild(curl.root);
    S.push({ el, front, back, a: 0, z: 0, far: true, curl: curl.root, strips: curl.strips });
  }
  const faceOfLeaf = (k) => (k % 2 === 0 ? S[k / 2].front : S[(k - 1) / 2].back);

  // ---- state ----
  let cur = 0;          // kitni sheets palat chuki hain (0 = cover band, N = end band)
  let focus = 0;        // chhoti screen: 0 = left page poora, 1 = right page poora
  let fo = 0;           // focus ka animated float (0..1)
  let moving = false;
  let busy = false;

  /* ---------------- drawing ---------------- */
  function applyCurl(s, a) {
    const rad = a * Math.PI / 180;
    const d = BEND * Math.sin(rad);
    const th0 = a - (K - 1) * d;
    s.strips[0].el.style.transform = "translateZ(" + (s.z * 0.3) + "px) rotateY(" + (-th0) + "deg)";
    for (let j = 0; j < K; j++) {
      if (j > 0) s.strips[j].el.style.transform = "rotateY(" + (-d) + "deg)";
      const phi = Math.min(180, th0 + j * d);
      const t = Math.sin(phi * Math.PI / 180);
      s.strips[j].shf.style.opacity = phi < 90 ? (t * 0.42).toFixed(3) : 0;
      s.strips[j].shb.style.opacity = phi >= 90 ? (t * 0.42).toFixed(3) : 0;
    }
  }

  function setAngle(i, a) {
    const s = S[i];
    s.a = a;
    const flat = (a <= 0.05 || a >= 179.95) && !s.far;
    const curl = a > 0.05 && a < 179.95 && !s.far;
    s.el.style.visibility = flat ? "visible" : "hidden";
    if (!moving && a <= 0.05) s.el.style.transform = "none";
    else s.el.style.transform = (moving ? "translateZ(" + (s.z * 0.3) + "px) " : "") + "rotateY(" + (-a) + "deg)";
    s.curl.style.display = curl ? "block" : "none";

    const t = Math.sin(a * Math.PI / 180);
    s.front._shade.style.opacity = a < 90 ? (t * 0.45).toFixed(3) : 0;
    s.back._shade.style.opacity = a >= 90 ? (t * 0.45).toFixed(3) : 0;

    const uR = S[i + 1], uL = S[i - 1];
    if (uR) uR.front._under.style.opacity = curl ? (0.34 * t * (a < 90 ? 1 : 0.35)).toFixed(3) : 0;
    if (uL) uL.back._under.style.opacity = curl ? (0.34 * t * (a > 90 ? 1 : 0.35)).toFixed(3) : 0;
    if (curl) applyCurl(s, a);
  }

  function render() {
    const t0 = S[0].a / 180, tL = S[N - 1].a / 180;
    const center = (vw - 2 * W) / 2;
    const base = peek ? MRG + fo * (vw - 2 * MRG - 2 * W) : center;
    const xc = (vw - W) / 2 - W, xe = (vw - W) / 2;
    const x0 = base + (1 - t0) * (xc - base) + tL * (xe - base);
    wrap.style.transform = "translateX(" + (x0 - center).toFixed(2) + "px)";
    const left = W * (1 - t0), right = W + W * (1 - tL);
    shadow.style.left = left + "px"; shadow.style.width = Math.max(0, right - left) + "px";
    board.style.left = (left - 6) + "px"; board.style.width = (right - left + 12) + "px";
    stack.style.left = (left + 4) + "px"; stack.style.width = Math.max(0, right - left + 10) + "px";
    ribbon.style.left = (right - W * 0.32 - 8) + "px";
  }

  function layout(topIndex) {
    moving = typeof topIndex === "number";
    for (let i = 0; i < N; i++) {
      S[i].z = i < cur ? i + 1 : N - i;
      S[i].far = moving ? !(i >= cur - 2 && i <= cur + 1) : !(i >= cur - 1 && i <= cur);
    }
    if (moving) { S[topIndex].z = N + 6; S[topIndex].far = false; }
    for (let i = 0; i < N; i++) setAngle(i, S[i].a);
    render();
  }

  /* ---------------- caption / buttons / hotspots ---------------- */
  function leafLabel(k) { return leaves[k] == null ? "Blank Page" : "Page " + k; }
  function capText() {
    if (cur === 0) return "Cover Page";
    if (cur >= N) return "End Page";
    const L = 2 * cur - 1, R = 2 * cur;
    if (peek) return leafLabel(focus ? R : L);
    return leaves[R] == null ? "Page " + L : "Page " + L + " \u2013 " + R;
  }
  function pageFocused(k) {
    if (cur === 0) return k === 0;
    if (cur >= N) return k === M - 1;
    const L = 2 * cur - 1, R = 2 * cur;
    return peek ? k === (focus ? R : L) : (k === L || k === R);
  }
  const vns = [];
  function ui() {
    btnPrev.disabled = cur <= 0;
    btnNext.disabled = cur >= N;
    cap.textContent = capText();
    hint.classList.toggle("off", cur > 0);
    vns.forEach((v) => { v.el.style.pointerEvents = pageFocused(v.page) ? "auto" : "none"; });
  }

  /* ---------------- animation helpers ---------------- */
  const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tween(dur, step, done) {
    const t0 = performance.now();
    busy = true;
    if (reduced()) dur = 1;
    (function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      step(ease(p));
      if (p < 1) requestAnimationFrame(frame);
      else { busy = false; done && done(); }
    })(t0);
  }
  const durFor = (from, to) => Math.max(320, Math.abs(to - from) / 180 * 1000);

  // flip ke dauran camera (focus) bhi saath saath sarakta hai
  function flipApply(i, side, fo0) {
    return (a) => {
      if (peek) fo = side === "next" ? fo0 * (1 - a / 180) : fo0 + (1 - fo0) * (1 - a / 180);
      setAngle(i, a); render();
    };
  }
  function runFlip(i, to, side, fo0, commit) {
    const from = S[i].a, apply = flipApply(i, side, fo0);
    tween(durFor(from, to), (e) => apply(from + (to - from) * e), () => {
      if (commit) { cur = side === "next" ? i + 1 : i; focus = side === "next" ? 0 : 1; }
      fo = focus;
      layout(); ui();
    });
  }
  function onCommit() { hint.classList.add("off"); startBgm(); flipSound(); stopVN(); }

  function panTo(target) {
    if (busy || focus === target) return;
    stopVN();
    const f0 = fo;
    focus = target;
    ui();
    tween(560, (e) => { fo = f0 + (target - f0) * e; render(); }, () => { fo = target; render(); ui(); });
  }

  const canPan = () => peek && cur >= 1 && cur <= N - 1;
  function next() {
    if (busy || cur >= N) return;
    if (canPan() && focus === 0) { panTo(1); return; }
    const i = cur;
    onCommit(); layout(i);
    runFlip(i, 180, "next", fo, true);
  }
  function prev() {
    if (busy || cur <= 0) return;
    if (canPan() && focus === 1) { panTo(0); return; }
    const i = cur - 1;
    onCommit(); layout(i);
    runFlip(i, 0, "prev", fo, true);
  }

  /* ---------------- swipe / tap ---------------- */
  let drag = null;
  stage.addEventListener("pointerdown", (e) => {
    if (busy || e.target.closest(".hot, .btn")) return;
    const r = wrap.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    drag = { sx: e.clientX, id: e.pointerId, lx: e.clientX, lt: performance.now(), vx: 0, moved: false, kind: null, dir: null, i: -1, inside, spine: r.left + W, fo0: focus };
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });

  stage.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx;
    if (!drag.moved) {
      if (Math.abs(dx) < 6) return;
      const dir = dx < 0 ? "next" : "prev";
      if ((dir === "next" && cur >= N) || (dir === "prev" && cur <= 0)) return;
      drag.dir = dir;
      drag.kind = (canPan() && ((dir === "next" && focus === 0) || (dir === "prev" && focus === 1))) ? "pan" : "flip";
      drag.moved = true;
      stage.classList.add("dragging");
      if (drag.kind === "flip") {
        drag.i = dir === "next" ? cur : cur - 1;
        hint.classList.add("off");
        layout(drag.i);
        drag.apply = flipApply(drag.i, dir, fo);
      }
    }
    const now = performance.now();
    const dt = Math.max(1, now - drag.lt);
    drag.vx = 0.8 * drag.vx + 0.2 * ((e.clientX - drag.lx) / dt);
    drag.lx = e.clientX; drag.lt = now;
    if (drag.kind === "pan") {
      const T = vw - 2 * MRG - 2 * W;                       // negative
      fo = Math.min(1, Math.max(0, drag.fo0 + dx / T));
      render();
    } else {
      const k = Math.min(1, Math.max(0, Math.abs(dx) / (W * 1.1)));
      drag.apply(drag.dir === "next" ? k * 180 : 180 - k * 180);
    }
  });

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    stage.classList.remove("dragging");
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
    if (!d.moved) {
      if (e.type === "pointerup" && d.inside) (e.clientX >= d.spine ? next : prev)();
      return;
    }
    if (d.kind === "pan") {
      const towards = d.fo0 === 0 ? 1 : 0;
      const prog = Math.abs(fo - d.fo0);
      const fast = d.dir === "next" ? d.vx < -0.45 : d.vx > 0.45;
      const commit = prog > 0.3 || fast;
      const target = commit ? towards : d.fo0;
      const f0 = fo;
      if (commit) stopVN();
      focus = target; ui();
      tween(Math.max(260, Math.abs(target - f0) * 520), (e2) => { fo = f0 + (target - f0) * e2; render(); }, () => { fo = target; render(); ui(); });
      return;
    }
    const i = d.i, a = S[i].a;
    const commit = d.dir === "next" ? (a > 55 || d.vx < -0.45) : ((180 - a) > 55 || d.vx > 0.45);
    const to = d.dir === "next" ? (commit ? 180 : 0) : (commit ? 0 : 180);
    if (commit) onCommit();
    const apply = d.apply, from = a;
    tween(durFor(a, to), (e2) => apply(from + (to - from) * e2), () => {
      if (commit) { cur = d.dir === "next" ? i + 1 : i; focus = d.dir === "next" ? 0 : 1; }
      fo = focus;
      layout(); ui();
    });
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  btnNext.addEventListener("click", next);
  btnPrev.addEventListener("click", prev);
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); prev(); }
  });

  /* ---------------- sizing ---------------- */
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function fit() {
    vw = window.innerWidth; vh = window.innerHeight;
    const reserve = Math.min(128, vh * 0.22);
    const H0 = vh - reserve, W0 = H0 * CONFIG.ratio;
    if (2 * W0 + 36 <= vw) { peek = false; W = W0; H = H0; }
    else {
      peek = true;
      PEEK = clamp(vw * 0.12, 30, 60);
      W = Math.min(vw - MRG - PEEK, W0);
      H = W / CONFIG.ratio;
    }
    const r = document.documentElement.style;
    r.setProperty("--W", W.toFixed(1) + "px");
    r.setProperty("--H", H.toFixed(1) + "px");
    if (!peek) { fo = 0; }
    else fo = focus;
    render(); ui();
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 250));

  /* ================= MUSIC (loop, band nahi hota) ================= */
  const bgmList = [].concat(CONFIG.bgm); let bgmIdx = 0;
  const bgm = new Audio(bgmList[0]);
  bgm.loop = true; bgm.preload = "auto"; bgm.volume = 0;
  let bgmStarted = false, vnPlaying = false, volTimer = null;
  const tryPlay = () => { if (vnPlaying) return; const q = bgm.play(); if (q && q.catch) q.catch(() => {}); };

  bgm.addEventListener("error", () => {
    if (++bgmIdx < bgmList.length) { bgm.src = bgmList[bgmIdx]; bgm.load(); if (bgmStarted) tryPlay(); }
  });
  function targetVol() { return vnPlaying ? 0 : CONFIG.bgmVolume; }
  function fadeTo(v, ms) {
    clearInterval(volTimer);
    const from = bgm.volume, t0 = performance.now();
    volTimer = setInterval(() => {
      const p = Math.min(1, (performance.now() - t0) / ms);
      bgm.volume = Math.min(1, Math.max(0, from + (v - from) * p));
      if (p >= 1) clearInterval(volTimer);
    }, 40);
  }
  function startBgm() {
    if (bgmStarted || vnPlaying) return;
    bgmStarted = true;
    const q = bgm.play();
    if (q && q.catch) q.catch(() => { bgmStarted = false; });
    fadeTo(targetVol(), 2500);
  }
  ["pointerdown", "pointerup", "keydown", "touchend"].forEach((ev) =>
    window.addEventListener(ev, () => { if (!bgmStarted) startBgm(); else if (bgm.paused) tryPlay(); }, { passive: true }));
  bgm.addEventListener("pause", () => { if (bgmStarted && !document.hidden) setTimeout(() => { if (bgm.paused) tryPlay(); }, 200); });
  bgm.addEventListener("ended", () => { bgm.currentTime = 0; tryPlay(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && bgmStarted && bgm.paused) tryPlay(); });

  /* ================= PAGE TURN SOUND (synth) ================= */
  let actx = null;
  function flipSound() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const len = Math.floor(actx.sampleRate * 0.45);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let k = 0; k < len; k++) { const t = k / len; d[k] = (Math.random() * 2 - 1) * Math.sin(Math.PI * t) * (1 - t * 0.5); }
      const src = actx.createBufferSource(); src.buffer = buf;
      const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 0.6;
      const g = actx.createGain(); g.gain.value = 0.10;
      src.connect(bp); bp.connect(g); g.connect(actx.destination);
      src.start();
    } catch (_) {}
  }

  /* ================= VOICE NOTES ================= */
  let activeVN = null;
  function resumeBgm() { if (!bgmStarted) return; tryPlay(); fadeTo(targetVol(), 900); }
  function stopVN(noResume) {
    if (!activeVN) return;
    activeVN.audio.pause();
    activeVN.audio.currentTime = 0;
    activeVN.el.classList.remove("playing");
    activeVN.fill.style.width = "0";
    activeVN = null;
    vnPlaying = false;
    if (!noResume) resumeBgm();
  }
  function toggleVN(vn) {
    if (activeVN && activeVN === vn) { stopVN(); return; }
    stopVN(true);
    vn.audio.currentTime = 0;
    const q = vn.audio.play();
    if (q && q.catch) q.catch(() => {});
    vn.el.classList.add("playing");
    activeVN = vn;
    vnPlaying = true;
    fadeTo(0, 300);
    setTimeout(() => { if (vnPlaying) bgm.pause(); }, 330);
  }
  (CONFIG.voiceNotes || []).forEach((cfg) => {
    if (cfg.page < 0 || cfg.page >= M) return;           // leaf index == page number
    const face = faceOfLeaf(cfg.page);
    const el = document.createElement("div");
    el.className = "hot";
    el.style.left = cfg.x + "%"; el.style.top = cfg.y + "%";
    el.style.width = cfg.w + "%"; el.style.height = cfg.h + "%";
    el.setAttribute("role", "button"); el.setAttribute("aria-label", "Voice note chalao");
    const fill = document.createElement("div"); fill.className = "fill"; el.appendChild(fill);
    const ico = document.createElement("div"); ico.className = "ico"; ico.innerHTML = "<i></i><i></i>"; el.appendChild(ico);
    const audio = new Audio(cfg.src); audio.preload = "none";
    const vn = { audio, el, fill, page: cfg.page };
    audio.addEventListener("timeupdate", () => { if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%"; });
    audio.addEventListener("ended", () => { if (activeVN === vn) stopVN(); });
    el.addEventListener("pointerdown", (e) => e.stopPropagation());
    el.addEventListener("click", (e) => { e.stopPropagation(); toggleVN(vn); });
    face.appendChild(el);
    vns.push(vn);
  });

  /* ================= PRELOAD + LOADING SCREEN ================= */
  function preload() {
    const list = leaves.filter(Boolean);
    return Promise.all(list.map((src) => new Promise((res) => {
      const im = new Image();
      im.onload = () => {
        if (src === leaves[1] && im.naturalWidth && im.naturalHeight) { CONFIG.ratio = im.naturalWidth / im.naturalHeight; fit(); }
        res();
      };
      im.onerror = res; im.src = src;
    })));
  }

  document.addEventListener("gesturestart", (e) => e.preventDefault());
  window.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", (e) => e.preventDefault());

  layout(); fit();

  const LOAD_MS = 8000;
  let allLoaded = false;
  preload().then(() => { allLoaded = true; });
  setTimeout(() => { allLoaded = true; }, 25000);
  const barFill = $("barfill"), pctEl = $("pct"), loader = $("loader");
  const tStart = performance.now();
  function loadTick(now) {
    const p = Math.min(1, (now - tStart) / LOAD_MS);
    const e = 0.4 * p + 0.6 * (p * p * (3 - 2 * p));
    let pct = Math.floor(e * 100);
    if (p >= 1 && !allLoaded) pct = 99;
    if (p >= 1 && allLoaded) {
      barFill.style.width = "100%"; pctEl.textContent = "100%";
      setTimeout(() => { loader.classList.add("hide"); setTimeout(() => { loader.style.display = "none"; }, 1000); }, 450);
      return;
    }
    barFill.style.width = pct + "%"; pctEl.textContent = pct + "%";
    requestAnimationFrame(loadTick);
  }
  requestAnimationFrame(loadTick);
})();
</script>
</body>
</html>
